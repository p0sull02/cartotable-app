<style>
/* One visual world with the TV idle screen: a dark instrument screen, a pen that draws at human speed, the HUD in the corners. */
:root{--bg:#0a0e13;--panel:#0f151c;--card:#141c26;--line:#1d2834;--ink:#d9dfe6;--dim:#6f7d8c;--grid:#151e28;--accent:#ff8a3d;--steel:#5f93c0;
 --mono:ui-monospace,"SF Mono","IBM Plex Mono",Menlo,Consolas,monospace;--label:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 4px;max-width:1100px;margin:0 auto}
.kick{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink)}
.kick::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:9px;vertical-align:1px}
h1{font-family:var(--label);font-weight:600;font-size:30px;letter-spacing:.04em;margin:4px 0 0;line-height:1.05}
.sub{color:var(--dim);font-size:13px;font-family:var(--mono);letter-spacing:.02em;margin-top:4px}
main{max-width:1100px;margin:0 auto;padding:0 12px 40px}
.pick{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0 6px}
@media(min-width:760px){.pick{grid-template-columns:.8fr 1.7fr 1.5fr}}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

.seg button{flex:1 1 auto;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:8px 10px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#14100b}
#why{color:#ffc58f;font-size:13px;margin:2px 2px 6px}

@media(min-width:960px){.stage{grid-template-columns:1.55fr 1fr}}

#cvWrap:fullscreen #cv{width:100vw;height:100vh;object-fit:contain}

#stepN{font-family:var(--label);font-weight:600;font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
#stepT{font-family:var(--label);font-weight:600;font-size:23px;letter-spacing:.03em;margin:2px 0 4px;line-height:1.1}
#say{font-size:14.5px}#say b{color:#fff}#say .tip{display:block;margin-top:7px;color:#ffc58f;font-size:13.5px;border-left:2px solid var(--accent);padding-left:8px}
.ctl{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}

/* the field book: monospace, the new row typed in the accent colour */
#bookWrap{padding:10px 12px 12px}

table.bk th:nth-child(-n+2),table.bk td:nth-child(-n+2){text-align:left}
table.bk tr.new td{color:var(--accent)}table.bk tr.hl td{color:#fff;background:#1a2532}
table.bk td.lr.hl{color:var(--accent);background:#1a2532}
td.ok{color:#4cc38a!important}
.note{color:var(--dim);font-size:12.5px;margin:8px 2px 0}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:18px;font-family:var(--mono)}
</style>

<div class="kick">Tacheo · Training</div><h1>How to run a cave survey</h1><div class="sub">Pick your team and your gear. It plays the survey through, then how to sketch it.</div></header>
<main>
<div class="pick">
 <div class="grp"><div class="k">People</div><div class="seg" id="pPeople"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3" class="on">3</button></div></div>
 <div class="grp"><div class="k">Gear</div><div class="seg" id="pGear"><button data-v="analog" class="on">Compass, clino &amp; tape</button><button data-v="device">Survey device + sketch book</button><button data-v="digital">Digital (device + tablet)</button></div></div>
 <div class="grp"><div class="k">Method</div><div class="seg" id="pMethod"><button data-v="classic" class="on">Classic: survey as you go</button><button data-v="shoot">Shoot-through, then sketch</button></div></div>
</div>
<div id="why"></div>
<div class="chap"><button id="cSurvey" class="on">1 · The survey</button><button id="cSketch">2 · The sketch</button></div>
<div class="stage">
 <div class="box">
  <div id="cvWrap"><canvas id="cv" aria-label="The passage, the stations and the team"></canvas><button id="fsB" title="Full screen">⛶</button></div>
  <div class="roles" id="roles"></div>
 </div>
 <div class="box">
  <div id="cap"><div id="stepN"></div><div id="stepT"></div><div id="say"></div></div>
  <div class="ctl"><button id="bBack" title="Back">‹</button><button id="bPlay" class="play" title="Play">▶</button><button id="bNext" title="Next">›</button><input type="range" id="bar" min="0" value="0"></div>
  <div id="bookWrap"></div>
 </div>
</div>
<footer>Tacheo · Tacheo · step-by-step survey and sketching tutorial</footer>
</main>
<script>
(function(){
"use strict";
var TAU=Math.PI*2,D2R=Math.PI/180;
var MONO='ui-monospace,"SF Mono","IBM Plex Mono",Menlo,Consolas,monospace',LABEL='"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif';
var C={bg:'#0a0e13',page:'#0c1219',grid:'#151e28',grid2:'#1b2836',ink:'#d9dfe6',dim:'#6f7d8c',accent:'#ff8a3d',steel:'#5f93c0',wall:'#55657a',fill:'#111a24',laser:'#ff4d4d',tape:'#f5c542',bad:'#ff5d5d'};
function $(i){return document.getElementById(i);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function ease(k){k=clamp(k,0,1);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;}
function rng(seed){var s=(seed>>>0)||0x9e3779b9;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

// ------------------------------------------------------------------ the cave (plan view: 4 units = 1 ft, y down the page)
var U=4;                                                                              // units per foot
var ST=[[40,215],[128,178],[214,212],[300,166],[388,196],[474,156]];                  // stations A1..A6
var INC=[-3.5,6.0,-9.5,2.5,4.0];                                                     // the legs' slopes
var LR=[[4,5],[6,3],[3,7],[5,4],[7,3],[4,4]],UD=[[5,1],[3,2],[8,1],[4,0],[6,2],[3,1]];  // passage size at each station (ft)
function nm(i){return'A'+(i+1);}
function leg(i){var a=ST[i],b=ST[i+1],dx=b[0]-a[0],dy=a[1]-b[1],hd=Math.hypot(dx,dy)/U,inc=INC[i];return{hd:hd,d:hd/Math.cos(inc*D2R),az:(Math.atan2(dx,dy)/D2R+360)%360,inc:inc};}
// the wall point at station i: across the passage on the bisector of the legs, at the LRUD distance (s -1 left, +1 right)
function across(i){var q=ST[Math.min(ST.length-1,i+1)],r=ST[Math.max(0,i-1)],dx=q[0]-r[0],dy=q[1]-r[1],L=Math.hypot(dx,dy)||1;return[-dy/L,dx/L];}
function side(i,s){var p=ST[i],n=across(i),w=s<0?LR[i][0]:LR[i][1];return[p[0]+n[0]*w*U*s,p[1]+n[1]*w*U*s];}
// a place in the passage near station i: off = [along the passage (+ ahead), across it (+ right)], in units - kept inside the walls
function inPassage(i,off){var n=across(i),f=[n[1],-n[0]],lat=off[1],w=(lat>=0?LR[i][1]:LR[i][0])*U*.62;lat=clamp(lat,-w,w);
 return[ST[i][0]+f[0]*off[0]+n[0]*lat,ST[i][1]+f[1]*off[0]+n[1]*lat];}
// the real walls: through the LRUD points, with the wiggle a cave wall has
// (with the passage the team came in by, back past A1)
function wall(s){var r=rng(s<0?11:23),out=[],n0=across(0),pre=[ST[0][0]-(ST[1][0]-ST[0][0])*.75,ST[0][1]-(ST[1][1]-ST[0][1])*.75+10],w0=(s<0?LR[0][0]:LR[0][1])*U*1.1,
 P=[[pre[0]+n0[0]*w0*s,pre[1]+n0[1]*w0*s]].concat(ST.map(function(q,i){return side(i,s);}));
 for(var i=0;i<P.length;i++){var a=P[i];out.push(a);if(i<P.length-1){var b=P[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
 for(var k=1;k<6;k++){var t=k/6,o=(r()-.5)*2*Math.min(9,L*.08)*Math.sin(Math.PI*t);out.push([a[0]+dx*t+nx*o,a[1]+dy*t+ny*o]);}}}return out;}
var WL=wall(-1),WR=wall(1);
function wallTo(w,k){return w.slice(6,6+k*6+1);}                                       // the wall from A1 to station k

// ------------------------------------------------------------------ the picker
var sel={people:3,gear:'analog',method:'classic'};
function valid(p,g,m){if(m!='shoot')return'';if(g=='analog')return'Shoot-through needs two survey devices that each take a whole shot - a front-sight unit and a back-sight unit. Pick a survey device or digital.';if(p<2)return'Shoot-through needs one person on each unit - at least two people.';return'';}
function hook(id,key){[].forEach.call(document.querySelectorAll('#'+id+' button'),function(b){b.onclick=function(){sel[key]=key=='people'?+b.dataset.v:b.dataset.v;
 var w=valid(sel.people,sel.gear,sel.method);if(w){sel.method='classic';$('why').textContent=w+' Showing the classic way instead.';}else $('why').textContent='';build();};});}
function sync(){[['pPeople','people'],['pGear','gear'],['pMethod','method']].forEach(function(x){[].forEach.call(document.querySelectorAll('#'+x[0]+' button'),function(b){b.classList.toggle('on',String(sel[x[1]])==b.dataset.v);});});}

// ------------------------------------------------------------------ the roles
var COL={P:'#f5c542',I:'#6aa8e0',B:'#4cc38a',S:'#c79bff',F:'#f5c542',K:'#6aa8e0',D:'#4cc38a'};
function roles(p,g,m){
 var dev=g!='analog',dig=g=='digital';
 if(m=='shoot'){if(p==3)return{F:'Front - sets stations, back-sight unit',K:'Back - front-sight unit',D:dig?'Sketcher - tablet, sketches as the shots arrive':'Sketcher - book and sketch, follows'};return{F:'Front - sets stations, back-sight unit',K:dig?'Back - front-sight unit + tablet':'Back - front-sight unit'};}
 if(p==3)return dev?{P:'Point - sets stations, holds the light',I:'Instrument - shoots the device',B:dig?'Sketcher - tablet':'Book & sketch'}:{P:'Point - tape, sets stations, holds the light, LRUDs',I:'Instruments - compass & clino',B:'Book & sketch'};
 if(p==2)return dev?{I:'Instrument - sets stations and shoots',B:dig?'Sketcher - tablet':'Book & sketch'}:{P:'Point - tape, sets stations, holds the light, LRUDs',I:'Instruments, book & sketch'};
 return{S:dev?'Solo - device, '+(dig?'phone or tablet':'book and sketch'):'Solo - compass, clino, tape (tied off) & book'};}

// ------------------------------------------------------------------ chapter 1: the survey, as steps (each a state of the team)
var steps=[],firstSketch=0;
function build(){sync();var p=sel.people,g=sel.gear,m=sel.method,dev=g!='analog',dig=g=='digital',R=roles(p,g,m),ids=Object.keys(R);
 steps=[];var st={pos:{},si:{},beam:null,book:[],lrud:{},newLr:[],sketch:-1,marks:0,feet:0};
 ids.forEach(function(k,j){st.pos[k]=inPassage(0,[-36-j*20,6]);st.si[k]=-1;});
 function snap(t,say,tip){var c=JSON.parse(JSON.stringify(st));c.kind='survey';c.t=t;c.say=say+(tip?'<span class="tip">'+tip+'</span>':'');steps.push(c);st.beam=null;st.newRow=-1;st.newLr=[];}
 function at(k,i,off){st.pos[k]=inPassage(i,off||[0,0]);st.si[k]=i;}
 function fs(i){var l=leg(i),r=st.book[i]||{f:nm(i),t:nm(i+1)};r.d=l.d;r.az=l.az;r.inc=l.inc;st.book[i]=r;st.newRow=i;}
 function bs(i){var l=leg(i),r=st.book[i];r.baz=(l.az+180+(i%2?0.5:-0.5))%360;r.binc=-l.inc+(i%2?-0.5:0.5);st.newRow=i;}
 function lrud(i){st.lrud[i]=1;st.newLr.push(i);}
 var rd=function(x,n){return x.toFixed(n);};
 var gearTxt=g=='analog'?'a compass and clinometer (Suunto or similar), a fiberglass tape, a survey book, pencils and flagging':g=='device'?'a survey device that takes the whole shot - distance, azimuth and inclination - in one go (a Tacheo, DistoX or SAP), a survey book, a cave compass (plotting protractor), pencils and flagging':'a survey device linked by Bluetooth to a phone or tablet running a survey app (Tacheo\'s Survey, TopoDroid or SexyTopo), and flagging';
 snap('The gear and who does what','You need '+gearTxt+'.<br><br>'+ids.map(function(k){return'<b>'+R[k].split(' - ')[0]+'</b> - '+(R[k].split(' - ')[1]||'everything');}).join('<br>'),
  p==1?'Survey alone only on a trip where others know exactly where you are and when you\'re due out. Never cave alone.':m=='shoot'?'Shoot-through keeps the instruments moving and leaves the sketching for the way back - more footage for the time underground.':'');
 ids.forEach(function(k,j){at(k,0,[-14+j*15,22]);});
 snap('Start at a known station','Begin at a station that\'s already on the map - a tie-in station or the entrance. This is <b>A1</b>. '+(m=='shoot'?'Agree on a <b>footage goal</b> before you start (say 500 ft) - you shoot to it without stopping to sketch.':'Write the survey name, date, team and instruments at the top of the book page.'),
  dig?'Start a new survey in the app and connect the device first - check the first shot shows up.':'');
 st.marks=1;
 var nLegs=m=='shoot'?5:4,detail=2;
 for(var i=0;i<nLegs;i++){
  var quick=i>=detail,lg=leg(i),N=nm(i),N1=nm(i+1);
  if(m=='shoot'){
   at('F',i+1);at('K',i);if(R.D)at('D',Math.max(0,i-1),[-18,14]);st.marks=i+2;
   if(!quick)snap('Front sets '+N1,'<b>Front</b> walks ahead to a good spot - somewhere you can see back to '+N+' and forward again - and marks <b>'+N1+'</b> (flagging, a reflective dot, or a pencil mark on the rock).','Pick stations for the next shot as well as this one: where you can see both ways.');
   st.beam={from:'K',to:i+1,kind:'laser'};fs(i);
   if(!quick)snap('Back shoots the front sight','<b>Back</b>, standing on '+N+', shoots the <b>front sight</b> to the mark on '+N1+': '+rd(lg.d,1)+' ft, '+rd(lg.az,1)+'°, '+(lg.inc>0?'+':'')+rd(lg.inc,1)+'°. Shoot it three times - three matching shots make the leg.',dig?'The shot lands in the app by itself.':'The device keeps the shots - they\'re downloaded later, so nobody stops to write.');
   st.beam={from:'F',to:i,kind:'laser'};bs(i);
   if(!quick)snap('Front shoots the backsight','<b>Front</b>, on '+N1+', shoots the <b>backsight</b> to '+N+'. With a Tacheo pair, CrossTalk compares the two at once and tells you whether they agree - nobody checks the numbers by hand.','A backsight within 2° of the front sight (turned round 180°) is good. Out of tolerance: shoot both again before moving.');
   lrud(i+1);if(i==0)lrud(0);
   if(!quick)snap('LRUDs where you stand','Each of you takes the <b>LRUDs</b> - left, right, up and down - at your own station while you\'re there. On a Tacheo, hold SHOT half a second for an LRUD.');
   st.feet+=lg.d;
   if(R.D&&!quick){st.sketch=Math.max(st.sketch,i-1);snap('The sketcher follows','<b>Sketcher</b> works behind the shooters'+(dig?' with the shots already on the tablet':'')+', sketching the passage the data has already reached. Nobody waits for the sketch.');}
   if(quick&&i==detail)snap('Keep shooting to the goal','Front moves on, Back walks up to the station Front just left, and the same few shots repeat: front sight, backsight, LRUDs. <b>'+Math.round(st.feet)+' ft</b> so far.','No sketching stops - that\'s where the time goes on a normal survey.');
  }else{
   if(p==3){at('P',i+1);at('I',i);at('B',i,[-16,16]);}
   else if(p==2){if(dev){at('I',i+1);at('B',i,[-16,16]);}else{at('P',i+1);at('I',i);}}
   else at('S',i);
   st.marks=i+2;
   var setter=p==3?'Point':p==2&&!dev?'Point':p==2?'Instrument':'You';
   if(!quick)snap('Set '+N1,'<b>'+setter+'</b> '+(p==1||(p==2&&dev)?'pick':'goes ahead and picks')+' the next station, <b>'+N1+'</b> - a spot you can see from '+N+' and that looks on down the passage - and marks it.'+(p==1&&!dev?' Tie the tape\'s end to '+N+' (or use a topofil hip-chain) so it reads from the station.':'')+(p==2&&dev?' Then they come back to '+N+' to shoot.':''),'Short legs in twisty passage; longer ones where it runs straight.');
   if(p==2&&dev)at('I',i);
   if(!dev){st.beam={from:p==1?'S':'I',to:i+1,kind:'tape'};if(!quick)snap('Tape the distance','The tape runs from '+N+' to '+N1+', pulled straight and taut. '+(p==3?'<b>Point</b> holds it on the station; <b>Instruments</b> reads it at '+N+': ':'Read it: ')+'<b>'+rd(lg.d,1)+' ft</b>.','Read to the tenth of a foot. Call it out; the book says it back.');}
   st.beam={from:p==1?'S':'I',to:i+1,kind:dev?'laser':'sight'};fs(i);
   if(!quick)snap('Front sight',dev?('<b>'+(p==1?'You':'Instrument')+'</b>, on '+N+', puts the laser on the mark at '+N1+' and shoots: <b>'+rd(lg.d,1)+' ft, '+rd(lg.az,1)+'°, '+(lg.inc>0?'+':'')+rd(lg.inc,1)+'°</b>. Take it three times; three matching shots are the leg.'+(dig?' It arrives in the app on its own.':' Read it off the screen; the book writes it and says it back.')):
     '<b>'+(p==1?'You':'Instruments')+'</b> sight'+(p==1?'':'s')+' the light on '+N1+' through the compass, then the clino: <b>'+rd(lg.az,1)+'°</b> and <b>'+(lg.inc>0?'+':'')+rd(lg.inc,1)+'°</b>. '+(p==3?'Call them out - <b>Book</b> writes them down and reads them back.':'Write them down as you read them.'),
     dev?'':'Hold the instrument level, read to half a degree, and keep metal (helmet lights, carabiners) away from the compass.');
   if(p==3){at('I',i+1);at('P',i+1,[14,-16]);at('B',i);}else if(p==2){at('I',i+1);if(dev)at('B',i+1,[-16,16]);else at('P',i+1,[14,-16]);}else at('S',i+1);
   st.beam={from:p==1?'S':'I',to:i,kind:dev?'laser':'sight'};bs(i);
   if(!quick)snap('Backsight','<b>'+(p==1?'You':dev?'Instrument':'Instruments')+'</b> move'+(p==1?'':'s')+' up to '+N1+' and shoot'+(p==1?'':'s')+' back to '+N+'. The backsight should read the front sight turned round 180° - azimuth within 2°, inclination the same size with the sign flipped.'+(p==1||(p==2&&!dev)?' Leave a target (a light or a reflector) on '+N+' to sight back to.':p==3&&!dev?' <b>Book</b> holds a light on '+N+' to sight on.':''),'Out of tolerance? Shoot both again before you move on - it\'s the cheapest blunder you\'ll ever fix.');
   lrud(i);lrud(i+1);
   if(!quick)snap('LRUDs',(dev?'At each station, shoot the distances to the left and right walls, the ceiling and the floor - the <b>LRUDs</b>. On a Tacheo, hold SHOT half a second for an LRUD.':'At each station, '+(p>1?'<b>Point</b> measures':'measure')+' left, right, up and down to the walls - tape or a good estimate - the <b>LRUDs</b>.')+(p>1?' Book writes them on the station\'s line.':''));

  else if(e.k=='x'){var p3=S(e.p);ctx.strokeStyle=C.bad;ctx.lineWidth=2.4;var z=9*ease(f);ctx.beginPath();ctx.moveTo(p3[0]-z,p3[1]-z);ctx.lineTo(p3[0]+z,p3[1]+z);ctx.moveTo(p3[0]+z,p3[1]-z);ctx.lineTo(p3[0]-z,p3[1]+z);ctx.stroke();}

// ------------------------------------------------------------------ playing it
// One clock runs the whole tutorial (Sully, 26 Nov 2026: "I want a smooth animation, not sporadic step by step"): every step has its

var cur=-1,prevStep=null,timer=false,shown=null,T=0,holdTo=0,starts=[],durs=[],motion=[],total=0,barDrag=false;
