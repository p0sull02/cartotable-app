<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How to run a cave survey - Topside</title>
<style>
:root{--bg:#0f141b;--panel:#18202a;--card:#202a36;--line:#2c3846;--ink:#e6ecf2;--muted:#8a99a8;--amber:#f59e0b;--blue:#3b82f6;--green:#22c55e;--violet:#a78bfa;--red:#ef4444;--paper:#f6f1e3;--pencil:#3a3a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 6px;max-width:980px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--muted);font-size:13.5px}
main{max-width:980px;margin:0 auto;padding:0 12px 40px}
.pick{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
@media(min-width:720px){.pick{grid-template-columns:1fr 1.6fr 1.4fr}}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.grp .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg button:disabled{opacity:.35;cursor:not-allowed}
#why{color:#fcd34d;font-size:13px;margin:2px 2px 6px;min-height:0}
.stage{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.stage{grid-template-columns:1.45fr 1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
svg{display:block;width:100%;height:auto}
#cap{padding:12px 14px}
#stepT{font-size:17px;font-weight:700;margin:0 0 4px}#stepN{color:var(--muted);font-size:12.5px;font-weight:600}
#say{font-size:14.5px}#say b{color:#fff}#say .tip{display:block;margin-top:6px;color:#fcd34d;font-size:13.5px}
.ctl{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctl button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;min-width:42px;height:38px;font-size:16px;cursor:pointer;padding:0 12px;font-weight:700}
.ctl button.play{background:var(--blue);border-color:var(--blue)}
#bar{flex:1;min-width:120px;accent-color:var(--blue)}
.roles{display:flex;gap:10px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px}
.roles span{display:inline-flex;align-items:center;gap:6px}.roles i{width:16px;height:16px;border-radius:50%;display:inline-block;font-style:normal;font-size:10px;font-weight:800;color:#111;text-align:center;line-height:16px}
/* the book */
#bookWrap{padding:10px}
.paper{background:var(--paper);color:#222;border-radius:6px;padding:8px 8px 10px;font-family:"Courier New",ui-monospace,monospace;font-size:12.5px;box-shadow:inset 0 0 0 1px #d8cfb5}
.paper h3{font-family:inherit;font-size:12px;margin:0 0 4px;color:#7a6a40;letter-spacing:.06em}
table.bk{border-collapse:collapse;width:100%}
table.bk th{font-size:10.5px;color:#7a6a40;text-align:right;border-bottom:1px solid #c9bd99;padding:2px 3px;font-weight:700}
table.bk td{text-align:right;padding:2px 3px;border-bottom:1px dashed #ddd3b8;white-space:nowrap}
table.bk th:first-child,table.bk td:first-child,table.bk th:nth-child(2),table.bk td:nth-child(2){text-align:left}
table.bk tr.new td{background:#fde68a;transition:background 1.2s}
td.bs{color:#555}td.ok{color:#15803d;font-weight:700}
.phone{background:#0b0f14;border:2px solid #3a4756;border-radius:22px;padding:10px;max-width:420px;margin:0 auto}
.phone .scr{background:#121820;border-radius:12px;padding:8px;font-size:12px}
.phone .hd{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}
.phone table.bk th{color:#8a99a8;border-color:#2c3846}.phone table.bk td{color:#e6ecf2;border-color:#202a36}.phone table.bk tr.new td{background:#1e3a5f}
.phone td.bs{color:#93a4b6}.phone td.ok{color:#4ade80}
.note{color:var(--muted);font-size:12.5px;margin:8px 2px 0}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
.safety{background:#3b1d1d;border:1px solid #7f1d1d;color:#fecaca;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
</style>
</head>
<body>
<header><a id="back" href="index.html" style="display:none;color:#7fb0ff;text-decoration:none;font-weight:600;font-size:14px;margin-bottom:6px">‹ Back to Topside</a><h1>How to run a cave survey</h1><div class="sub">Pick your team and your gear - it plays the survey through, one step at a time.</div></header>
<main>
<div class="pick">
 <div class="grp"><div class="k">People</div><div class="seg" id="pPeople"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3" class="on">3</button></div></div>
 <div class="grp"><div class="k">Gear</div><div class="seg" id="pGear"><button data-v="analog" class="on">Compass, clino &amp; tape</button><button data-v="device">Survey device + sketch book</button><button data-v="digital">Digital (device + tablet)</button></div></div>
 <div class="grp"><div class="k">Method</div><div class="seg" id="pMethod"><button data-v="classic" class="on">Classic: survey as you go</button><button data-v="shoot">Shoot-through, then sketch</button></div></div>
</div>
<div id="why"></div>
<div class="stage">
 <div class="box">
  <svg id="sv" viewBox="0 100 520 178" aria-label="The passage, the stations and the team"></svg>
  <div class="roles" id="roles"></div>
 </div>
 <div class="box">
  <div id="cap"><div id="stepN"></div><div id="stepT"></div><div id="say"></div></div>
  <div class="ctl"><button id="bBack" title="Back">‹</button><button id="bPlay" class="play" title="Play">▶</button><button id="bNext" title="Next">›</button><input type="range" id="bar" min="0" value="0"></div>
  <div id="bookWrap"></div>
 </div>
</div>
<footer>Topside · Tacheo · step-by-step survey tutorial</footer>
</main>
<script>
(function(){
// ------------------------------------------------------------------ the cave (plan view, 1 unit = 1 ft)
var ST=[[40,215],[128,178],[214,212],[300,166],[388,196],[474,156]];                 // stations A1..A6
var INC=[-3.5,6.0,-9.5,2.5,4.0];                                                    // the legs' slopes
var LR=[[4,5],[6,3],[3,7],[5,4],[7,3],[4,4]], UD=[[5,1],[3,2],[8,1],[4,0],[6,2],[3,1]];  // passage size at each station (ft)
function nm(i){return'A'+(i+1);}
function leg(i){var a=ST[i],b=ST[i+1],dx=b[0]-a[0],dy=a[1]-b[1],hd=Math.hypot(dx,dy),inc=INC[i],d=hd/Math.cos(inc*Math.PI/180),az=(Math.atan2(dx,dy)*180/Math.PI+360)%360;return{d:d,az:az,inc:inc};}
// a passage outline round the stations (the real cave, drawn faint) and the sketched walls (drawn as the sketch grows)
function side(i,s){var p=ST[i],q=ST[Math.min(ST.length-1,i+1)],r=ST[Math.max(0,i-1)],dx=q[0]-r[0],dy=q[1]-r[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,w=s<0?LR[i][0]:LR[i][1];return[p[0]+nx*w*3.2*s,p[1]+ny*w*3.2*s];}
// ------------------------------------------------------------------ the picker
var sel={people:3,gear:'analog',method:'classic'};
function valid(p,g,m){if(m!='shoot')return'';if(g=='analog')return'Shoot-through needs two survey devices that each take a whole shot - a front-sight unit and a back-sight unit. Pick a survey device or digital.';if(p<2)return'Shoot-through needs one person on each unit - at least two people.';return'';}
function hook(id,key){[].forEach.call(document.querySelectorAll('#'+id+' button'),function(b){b.onclick=function(){sel[key]=key=='people'?+b.dataset.v:b.dataset.v;
 if(valid(sel.people,sel.gear,sel.method)){var w=valid(sel.people,sel.gear,sel.method);sel.method='classic';$('why').textContent=w+' Showing the classic way instead.';}else $('why').textContent='';build();};});}
function $(i){return document.getElementById(i);}
function sync(){[['pPeople','people'],['pGear','gear'],['pMethod','method']].forEach(function(x){[].forEach.call(document.querySelectorAll('#'+x[0]+' button'),function(b){b.classList.toggle('on',String(sel[x[1]])==b.dataset.v);});});}
// ------------------------------------------------------------------ the roles
var COL={L:'#f59e0b',I:'#3b82f6',B:'#22c55e',S:'#a78bfa',F:'#f59e0b',K:'#3b82f6',D:'#22c55e'};
function roles(p,g,m){
 var dev=g!='analog',dig=g=='digital';
 if(m=='shoot'){if(p==3)return{F:'Front - sets stations, back-sight unit',K:'Back - front-sight unit',D:dig?'Sketcher - tablet, sketches as the shots arrive':'Sketcher - book and sketch, follows'};return{F:'Front - sets stations, back-sight unit',K:dig?'Back - front-sight unit + tablet':'Back - front-sight unit'};}
 if(p==3)return dev?{L:'Point - sets stations, holds the light',I:'Instrument - shoots the device',B:dig?'Sketcher - tablet':'Book & sketch'}:{L:'Lead - tape, sets stations, LRUDs',I:'Instruments - compass & clino',B:'Book & sketch'};
 if(p==2)return dev?{I:'Instrument - sets stations and shoots',B:dig?'Sketcher - tablet':'Book & sketch'}:{L:'Lead - tape, sets stations, LRUDs',I:'Instruments, book & sketch'};
 return{S:dev?'Solo - device, '+(dig?'phone or tablet':'book and sketch'):'Solo - compass, clino, tape (tied off) & book'};}
// ------------------------------------------------------------------ the steps
var steps=[];
function build(){sync();var p=sel.people,g=sel.gear,m=sel.method,dev=g!='analog',dig=g=='digital',R=roles(p,g,m),ids=Object.keys(R);
 steps=[];var st={pos:{},beam:null,book:[],lrud:{},sketch:-1,marks:0,tag:'',feet:0};
 ids.forEach(function(k){st.pos[k]=[ST[0][0]-30-ids.indexOf(k)*16,ST[0][1]+30];});
 function snap(t,say,tip){var c=JSON.parse(JSON.stringify(st));c.t=t;c.say=say+(tip?'<span class="tip">'+tip+'</span>':'');steps.push(c);st.beam=null;st.newRow=-1;}
 function at(k,i,off){st.pos[k]=[ST[i][0]+(off||[0,0])[0],ST[i][1]+(off||[0,0])[1]];}
 function fs(i){var l=leg(i),r=st.book[i]||{f:nm(i),t:nm(i+1)};r.d=l.d;r.az=l.az;r.inc=l.inc;st.book[i]=r;st.newRow=i;}
 function bs(i){var l=leg(i),r=st.book[i];r.baz=(l.az+180+(i%2?0.5:-0.5))%360;r.binc=-l.inc+(i%2?-0.5:0.5);st.newRow=i;}
 function lrud(i){st.lrud[i]=1;}
 var rd=function(x,n){return x.toFixed(n);};
 // ---- intro
 var gearTxt=g=='analog'?'a compass and clinometer (Suunto or similar), a fiberglass tape, a survey book, pencils and flagging':g=='device'?'a survey device that takes the whole shot - distance, azimuth and inclination - in one go (a Tacheo, DistoX or SAP), a survey book, pencils and flagging':'a survey device linked by Bluetooth to a phone or tablet running a survey app (Topside\'s Survey, TopoDroid or SexyTopo), and flagging';
 snap('The gear and who does what','You need '+gearTxt+'.<br><br>'+ids.map(function(k){return'<b>'+R[k].split(' - ')[0]+'</b> - '+(R[k].split(' - ')[1]||'everything');}).join('<br>'),
  p==1?'Survey alone only on a trip where others know exactly where you are and when you\'re due out. Never cave alone.':m=='shoot'?'Shoot-through keeps the instruments moving and leaves the sketching for the way back - more footage for the time underground.':'');
 // the first station
 ids.forEach(function(k,j){at(k,0,[-14+j*14,22]);});
 snap('Start at a known station','Begin at a station that\'s already on the map - a tie-in station or the entrance. This is <b>A1</b>. '+(m=='shoot'?'Agree on a <b>footage goal</b> before you start (say 500 ft) - you shoot to it without stopping to sketch.':'Write the survey name, date, team and instruments at the top of the book page.'),
  dig?'Start a new survey in the app and connect the device first - check the first shot shows up.':'');
 st.marks=1;
 var nLegs=m=='shoot'?5:4,detail=2;
 for(var i=0;i<nLegs;i++){
  var quick=i>=detail,lg=leg(i),N=nm(i),N1=nm(i+1);
  if(m=='shoot'){
   // Front walks ahead and sets the next station; Back stays at this one with the front-sight unit
   at('F',i+1,[10,-14]);at('K',i,[-10,14]);if(R.D)at('D',Math.max(0,i-1),[-6,20]);st.marks=i+2;
   if(!quick)snap('Front sets '+N1,'<b>Front</b> walks ahead to a good spot - somewhere you can see back to '+N+' and forward again - and marks <b>'+N1+'</b> (flagging, a reflective dot, or a pencil mark on the rock).','Pick stations for the next shot as well as this one: where you can see both ways.');
   st.beam={from:'K',to:i+1,kind:'laser'};fs(i);
   if(!quick)snap('Back shoots the front sight','<b>Back</b>, standing on '+N+', shoots the <b>front sight</b> to the mark on '+N1+': '+rd(lg.d,1)+' ft, '+rd(lg.az,1)+'°, '+(lg.inc>0?'+':'')+rd(lg.inc,1)+'°. Shoot it three times - three matching shots make the leg.',dig?'The shot lands in the app by itself.':'The device keeps the shots - they\'re downloaded later, so nobody stops to write.');
   st.beam={from:'F',to:i,kind:'laser2'};bs(i);
   if(!quick)snap('Front shoots the backsight','<b>Front</b>, on '+N1+', shoots the <b>backsight</b> to '+N+'. With a Tacheo pair, CrossTalk compares the two at once and tells you whether they agree - nobody checks the numbers by hand.','A backsight within 2° of the front sight (turned round 180°) is good. Out of tolerance: shoot both again before moving.');
   lrud(i+1);if(i==0)lrud(0);
   if(!quick)snap('LRUDs where you stand','Each of you takes the <b>LRUDs</b> - left, right, up and down - at your own station while you\'re there. On a Tacheo, hold SHOT half a second for an LRUD.');
   st.feet+=lg.d;
   if(R.D&&!quick){st.sketch=Math.max(st.sketch,i-1);snap('The sketcher follows','<b>Sketcher</b> works behind the shooters'+(dig?' with the shots already on the tablet':'')+', sketching the passage the data has already reached. Nobody waits for the sketch.');}
   if(quick&&i==detail)snap('Keep shooting to the goal','Front moves on, Back walks up to the station Front just left, and the same few shots repeat: front sight, backsight, LRUDs. <b>'+Math.round(st.feet)+' ft</b> so far.','No sketching stops - that\'s where the time goes on a normal survey.');
  }else{
   // classic, by team size
   if(p==3){at('L',i+1,[10,-14]);at('I',i,[-8,14]);at('B',i,[-22,24]);}
   else if(p==2){if(dev){at('I',i,[-8,12]);at('B',i,[-22,22]);}else{at('L',i+1,[10,-14]);at('I',i,[-10,14]);}}
   else at('S',i,[-8,12]);
   st.marks=i+2;
   var setter=p==3?'Lead':p==2&&!dev?'Lead':p==2?'Instrument':'You';
   if(!quick)snap('Set '+N1,'<b>'+setter+'</b> '+(p==1||(p==2&&dev)?'pick':'goes ahead and picks')+' the next station, <b>'+N1+'</b> - a spot you can see from '+N+' and that looks on down the passage - and marks it.'+(p==1&&!dev?' Tie the tape\'s end to '+N+' (or use a topofil hip-chain) so it reads from the station.':'')+(p==2&&dev?' Then they come back to '+N+' to shoot.':''),'Short legs in twisty passage; longer ones where it runs straight.');
   if(!dev){st.beam={from:p==1?'S':'I',to:i+1,kind:'tape'};if(!quick)snap('Tape the distance','The tape runs from '+N+' to '+N1+', pulled straight and taut. '+(p==3?'<b>Lead</b> holds it on the station; <b>Instruments</b> reads it at '+N+': ':'Read it: ')+'<b>'+rd(lg.d,1)+' ft</b>.','Read to the tenth of a foot. Call it out; the book says it back.');}
   st.beam={from:p==1?'S':'I',to:i+1,kind:dev?'laser':'sight'};fs(i);
   if(!quick)snap('Front sight',dev?('<b>'+(p==1?'You':'Instrument')+'</b>, on '+N+', puts the laser on the mark at '+N1+' and shoots: <b>'+rd(lg.d,1)+' ft, '+rd(lg.az,1)+'°, '+(lg.inc>0?'+':'')+rd(lg.inc,1)+'°</b>. Take it three times; three matching shots are the leg.'+(dig?' It arrives in the app on its own.':' Read it off the screen; the book writes it and says it back.')):
     '<b>'+(p==1?'You':'Instruments')+'</b> sight'+(p==1?'':'s')+' the light on '+N1+' through the compass, then the clino: <b>'+rd(lg.az,1)+'°</b> and <b>'+(lg.inc>0?'+':'')+rd(lg.inc,1)+'°</b>. '+(p==3?'Call them out - <b>Book</b> writes them down and reads them back.':'Write them down as you read them.'),
     dev?'':'Hold the instrument level, read to half a degree, and keep metal (helmet lights, carabiners) away from the compass.');
   // up to the next station and back
   if(p==3){at('I',i+1,[-8,14]);at('L',i+1,[10,-14]);at('B',i+1,[-22,24]);}else if(p==2){at('I',i+1,[-8,12]);if(dev)at('B',i+1,[-22,22]);else at('L',i+1,[12,-12]);}else at('S',i+1,[-8,12]);
   st.beam={from:p==1?'S':'I',to:i,kind:dev?'laser':'sight'};bs(i);
   if(!quick)snap('Backsight','<b>'+(p==1?'You':dev?'Instrument':'Instruments')+'</b> move'+(p==1?'':'s')+' up to '+N1+' and shoot'+(p==1?'':'s')+' back to '+N+'. The backsight should read the front sight turned round 180° - azimuth within 2°, inclination the same size with the sign flipped.'+(p==1?' Leave a target (a light or a reflector) on '+N+' to sight back to.':''),'Out of tolerance? Shoot both again before you move on - it\'s the cheapest blunder you\'ll ever fix.');
   lrud(i);lrud(i+1);
   if(!quick)snap('LRUDs',(dev?'At each station, shoot the distances to the left and right walls, the ceiling and the floor - the <b>LRUDs</b>. On a Tacheo, hold SHOT half a second for an LRUD.':'At each station, '+(p>1?'<b>Lead</b> measures':'measure')+' left, right, up and down to the walls - tape or a good estimate - the <b>LRUDs</b>.')+(p>1?' Book writes them on the station\'s line.':''));
   st.sketch=i;
   if(!quick)snap('Sketch',(p==3?'<b>'+(dig?'Sketcher':'Book')+'</b>':p==2?'<b>'+(dev?'Sketcher':'Instruments')+'</b>':'<b>You</b>')+' sketch'+(p==1?'':'es')+' the passage from '+N+' to '+N1+' to scale'+(dig?' on the tablet, over the line plot the shots have already drawn':' in the book, plotting the leg first from the numbers')+': the walls, the floor (rocks, mud, water), and a cross section at the station.','Draw what you see, not what you expect. Note leads, drops and anything that needs a second look.');
   if(quick&&i==detail)snap('Leapfrog on','Everyone moves up one station and does it again: set the next station, '+(dev?'':'tape, ')+'front sight, backsight, LRUDs, sketch. That\'s the rhythm of the whole trip.');
  }
 }
 // ---- the end
 var last=nm(nLegs);
 if(m=='shoot'){
  ids.forEach(function(k,j){at(k,nLegs,[-12+j*12,16]);});
  snap('Goal reached - turn round','At the footage goal (<b>'+Math.round(st.feet)+' ft</b>, '+last+'), the shooting stops. Now everyone sketches on the way out.','Download the devices first'+(dig?' - or check every shot is in the app -':'')+' so the line plot is there to sketch against.');
  var h=Math.ceil(nLegs/2);at('F',nLegs,[-10,16]);at('K',h,[-10,16]);if(R.D)at('D',h,[10,-14]);
  st.split=h;st.sketch=nLegs-1;
  snap('Split the sketching','The stations are shared out: '+(R.D?'<b>Front</b> sketches '+nm(h)+'-'+last+', <b>Back</b> and <b>Sketcher</b> share A1-'+nm(h):'<b>Front</b> sketches '+nm(h)+'-'+last+', <b>Back</b> sketches A1-'+nm(h))+'. Cross sections are handed out too. Each works against the shots already taken - on paper with a printed line plot, or on the tablet.','Two people sketching half each finish in half the time, and nobody stood around while the shots were taken.');
 }else{
  ids.forEach(function(k,j){at(k,nLegs,[-12+j*12,16]);});
  snap('Close it out','At the end, tie into a known station if you can - a loop closure checks the whole survey. Finish the sketch, '+(dig?'check every shot is in the app and save the survey':'check the book page is complete, and number the pages')+'.',dig?'':'Copy the book while it\'s fresh - and photograph every page before you leave the cave area.');
 }
 snap('Back at the computer',dev?'Plug the device in, or connect the app, and download the shots into Topside. The trip lands in your Walls project; CartoTable compiles it, checks loops and blunders, and lines the sketch up with the data.':'Type the book into your survey program (a Walls .srv file in Topside\'s CartoTable), then scan the sketch pages. CartoTable compiles the trip, checks the loops and flags any blunders.',
  'Do it within a day or two, while you can still read your own notes.');
 $('bar').max=steps.length-1;cur=0;show(0,true);
 $('roles').innerHTML=ids.map(function(k){return'<span><i style="background:'+COL[k]+'">'+k+'</i>'+R[k].split(' - ')[0]+'</span>';}).join('');}
// ------------------------------------------------------------------ drawing
var cur=0,timer=null,anim=null,shown=null;
function svgEl(t,a){var e=document.createElementNS('http://www.w3.org/2000/svg',t);for(var k in a)e.setAttribute(k,a[k]);return e;}
function drawScene(s,fromPos,f){var sv=$('sv');sv.innerHTML='';
 sv.appendChild(svgEl('rect',{x:0,y:100,width:520,height:178,fill:'#0b0f14'}));
 // the cave: a soft fill between the walls
 var L=ST.map(function(p,i){return side(i,-1);}),Rr=ST.map(function(p,i){return side(i,1);});
 var d='M'+L.map(function(p){return p.join(',');}).join(' L')+' L'+Rr.slice().reverse().map(function(p){return p.join(',');}).join(' L')+'Z';
 sv.appendChild(svgEl('path',{d:d,fill:'#1d2733',stroke:'#2c3846','stroke-width':1,'stroke-linejoin':'round'}));
 // the sketch: pencil walls up to the station reached

 // people

 Object.keys(pos).forEach(function(k){var p=pos[k];sv.appendChild(svgEl('circle',{cx:p[0],cy:p[1],r:9,fill:COL[k],stroke:'#0b0f14','stroke-width':2}));var t=svgEl('text',{x:p[0],y:p[1]+3.6,fill:'#111','font-size':10.5,'font-weight':800,'text-anchor':'middle','font-family':'system-ui,sans-serif'});t.textContent=k;sv.appendChild(t);});
 // north and the footage

function drawBook(s){var dig=sel.gear=='digital',dev=sel.gear!='analog',shoot=sel.method=='shoot';

  return'<tr class="'+(s.newRow===i?'new':'')+'"><td>'+r.f+'</td><td>'+r.t+'</td><td>'+(r.d?r.d.toFixed(1):'')+'</td><td>'+(r.az!=null?r.az.toFixed(1):'')+'</td><td>'+(r.inc!=null?(r.inc>0?'+':'')+r.inc.toFixed(1):'')+'</td><td class="'+(r.baz!=null?(ok?'ok':'bs'):'')+'">'+(r.baz!=null?r.baz.toFixed(1):'')+'</td><td class="bs">'+(r.binc!=null?(r.binc>0?'+':'')+r.binc.toFixed(1):'')+'</td><td>'+lr(i)+'</td></tr>';}).join('');

function show(i,jump){if(i<0||i>=steps.length)return;var prev=shown;cur=i;shown=steps[i];$('bar').value=i;

function play(on){clearInterval(timer);timer=null;$('bPlay').textContent=on?'❚❚':'▶';if(on){if(cur>=steps.length-1)show(0,true);timer=setInterval(function(){if(cur>=steps.length-1){play(false);return;}show(cur+1);},4200);}}
