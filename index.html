<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Topside</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Topside"><meta name="theme-color" content="#0e141b">
<style>
:root{--bg:#121820;--panel:#1a222c;--line:#2a3542;--ink:#e6ecf2;--muted:#8a99a8;--accent:#2f80ed;--amber:#fbbf24;--card:#202a36;--bar:#0e141b}
body.cave{--bg:#07090c;--panel:#0c1015;--line:#1c242e;--ink:#d8dee6;--muted:#7d8996;--accent:#b7791f;--card:#121820;--bar:#05070a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
#top{position:absolute;left:0;right:0;top:0;height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0 8px;display:flex;align-items:center;gap:7px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#top h1{font-size:15px;margin:0 2px;font-weight:600;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
.ib{background:#1f2935;border:1px solid var(--line);border-radius:9px;height:34px;min-width:34px;padding:0 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;flex:none;font-size:13px}
body.cave .ib{background:#141a21}
.ib.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;flex:none;color:#111}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:17px;overflow:hidden;flex:none}
.seg button{background:none;border:0;padding:7px 11px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
select,input[type=search],input[type=text]{background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;font-size:13px}
#wrap{position:absolute;left:0;right:380px;top:calc(50px + env(safe-area-inset-top));bottom:0}
#cv,#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#gl{display:none}
#side{position:absolute;right:0;top:calc(50px + env(safe-area-inset-top));bottom:0;width:380px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#tabs{display:flex;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#tabs::-webkit-scrollbar{display:none}
#homeBtn{position:sticky;left:0;z-index:3;background:#e9eef4;color:#0e141b;border-color:#e9eef4;font-weight:700;font-size:14px;padding:0 12px 0 10px;box-shadow:-10px 0 0 6px var(--bar),12px 0 10px 0 var(--bar)}
body.cave #homeBtn{background:#c9d2dc;border-color:#c9d2dc}   /* 17 Nov: the top bar scrolls sideways and took Home off screen */
#tabs button{flex:1 0 auto;background:none;border:0;color:var(--muted);padding:10px 10px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-size:13px}
body.cave #tabs button{font-size:15px;padding:12px 12px}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.subseg{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 10px}
/* 19 Nov 2026 (stage 2, proposal 10): the wordmark is branding, and on a phone it was 110 px of a bar that had to scroll. The Home
   button beside it says where you are; the name is on the Home screen and in About. */
@media (max-width:520px){#ttl{display:none}}
.subseg button{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pane{flex:1;overflow:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
body.cave #pane{font-size:15.5px}
#grip{display:none}
.k{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 5px}
.big{font-size:19px;font-weight:600;margin:2px 0 6px}
body.cave .big{font-size:22px}
.mut{color:var(--muted)}
.row{padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
body.cave .row{padding:13px 8px}
.row:hover{background:rgba(255,255,255,.04)}
.row .t{font-weight:600}.row .s{color:var(--muted);font-size:12.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
body.cave .btn{padding:13px 16px;font-size:16px;border-radius:10px}
.btn.alt{background:#2a3542;color:var(--ink)}
body.cave .btn.alt{background:#1a222c}
.btn:disabled{opacity:.45;cursor:default}
pre.rep{white-space:pre-wrap;font:13px/1.45 inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.stat{display:inline-block;margin:2px 14px 2px 0}.stat b{font-size:16px}
body.cave .stat b{font-size:21px}
table.sh{border-collapse:collapse;width:100%;font-size:12.5px}
table.sh th{text-align:left;color:var(--muted);font-weight:600;padding:4px 4px;border-bottom:1px solid var(--line);position:sticky;top:-12px;background:var(--panel)}
table.sh td{padding:4px 4px;border-bottom:1px solid var(--line)}
table.sh tr:hover td{background:rgba(255,255,255,.04);cursor:pointer}
.r{text-align:right}
.shelf{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.book{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer}
.cover{flex:none;width:54px;height:72px;border-radius:3px 6px 6px 3px;background:linear-gradient(90deg,#c9a227 0,#e8c341 12%,#f2cf4c 100%);box-shadow:inset 4px 0 0 #a8861d;color:#2b2405;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.05}
body.cave .cover{filter:brightness(.7)}
.cover .f{font-size:9px;letter-spacing:.08em;opacity:.8}.cover .l{font-size:10px;letter-spacing:-.2px;margin-top:3px;max-width:48px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.cover .n{font-size:15px}
.lab{display:flex;align-items:center;gap:8px;padding:6px 2px;cursor:pointer}
.lab input{width:18px;height:18px}
input[type=range]{width:100%}
#legend{position:absolute;left:10px;bottom:10px;background:rgba(14,20,27,.92);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;max-width:calc(100% - 150px);pointer-events:auto;cursor:pointer}
#legend span{display:inline-flex;align-items:center;margin:1px 9px 1px 0;white-space:nowrap}
#legend i{display:inline-block;width:16px;height:5px;border-radius:3px;margin-right:5px}
#legend.folded{padding:7px 12px;font-weight:600}
#layBtn{position:absolute;left:10px;top:10px;background:rgba(14,20,27,.92);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);z-index:3}
#scale{position:absolute;right:10px;bottom:10px;background:rgba(14,20,27,.92);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;pointer-events:none}
#north{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;background:rgba(14,20,27,.85);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
#locBtn{position:absolute;right:10px;top:58px;width:40px;height:40px;border-radius:50%;background:rgba(14,20,27,.85);border:1px solid var(--line);display:none;align-items:center;justify-content:center;cursor:pointer;color:#c9d2dc}
#locBtn.on{color:#4285f4;border-color:#4285f4}#locBtn.fol{background:#4285f4;color:#fff}#locBtn.wait svg{animation:locw 1.2s infinite}@keyframes locw{50%{opacity:.35}}   /* 18 Nov 2026: the phone's location */
#banner{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:rgba(14,20,27,.95);border:1px solid var(--amber);border-radius:10px;padding:6px 12px;font-size:13px;display:none;max-width:calc(100% - 80px);text-align:center}
#attr{position:absolute;right:10px;bottom:42px;font-size:10px;color:#aab6c2;background:rgba(14,20,27,.7);padding:2px 6px;border-radius:5px;pointer-events:none;max-width:60%}
.over{position:absolute;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 18px 30px;display:none}
.over .in{max-width:640px;margin:0 auto}
/* Home tiles (Sully, 16 Nov 2026: "Add tiles to the phone app for a home screen, just organizing it better. Add a tile for uploading pictures of data.") */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px 12px;min-height:112px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;color:var(--ink);font:inherit;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.98);border-color:var(--accent)}
.tile.fwTile{background:#1d4ed8;border-color:#1d4ed8;color:#fff;min-height:0}.tile.fwTile .ts{color:#dbe6ff}.tile.fwTile:active{border-color:#93b4ff}
.tile .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.tile .tt{font-weight:700;font-size:15px;line-height:1.2}
.tile .ts{color:var(--muted);font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .badge{position:absolute;top:9px;right:9px;background:var(--amber);color:#111;border-radius:11px;font-size:12px;font-weight:700;padding:1px 8px}
.hgrp{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:16px 2px -4px}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:12px}
body.cave .tile{min-height:124px}
body.cave .tile.wide{min-height:0}
body.cave .tile .tt{font-size:16px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.thumbs .th{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--line)}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .th .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:24px;padding:0;cursor:pointer}
.thumbs .th .st{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 4px;text-align:center}
.fld{width:100%;font-size:16px;padding:10px;background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-family:inherit}
.choice{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:10px 0;cursor:pointer}
.choice b{font-size:20px;display:block;margin-bottom:4px}
#scrBar{position:absolute;left:0;right:0;top:0;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0 6px;display:flex;align-items:center;gap:5px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#scrBar::-webkit-scrollbar{display:none}
#scrWrap{position:absolute;left:0;right:0;bottom:0;top:calc(46px + env(safe-area-inset-top));overflow:hidden;touch-action:none;background:#000}
#scrImg{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:8px 14px;z-index:30;display:none;max-width:90%}
@media (max-width:760px){
 #wrap{right:0;bottom:46vh}
 #side{left:0;width:auto;top:auto;height:46vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
 #side.min{height:52px}#wrap.full{bottom:52px}
 #grip{display:block;height:5px;width:44px;background:#3a4756;border-radius:3px;margin:6px auto 0;flex:none}
 #legend{max-width:calc(100% - 20px);bottom:40px;font-size:11px;padding:4px 7px}
 #legend .hd{display:none} #attr{bottom:72px}
 #top h1{max-width:26vw}
}
/* MapViewer and the landing page (20 Nov 2026) - MapViewer is red (Sully, 21:40: "Make the color scheme of this one Red") */
.land{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:left;border-radius:18px;padding:20px 18px 18px;margin:12px 0;cursor:pointer;color:#fff;border:1px solid transparent;font:inherit;-webkit-tap-highlight-color:transparent;min-height:150px}
.land:active{transform:scale(.985)}
.land .lic{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(255,255,255,.16);margin-bottom:4px}
.land .lt{font-size:24px;font-weight:800;letter-spacing:.01em}.land .ls{font-size:14px;line-height:1.35;opacity:.92}
.mvCard{background:linear-gradient(135deg,#2a3542 0,#1a222c 100%);border-color:#3a4756}.mvCard .lic{background:#dc2626}   /* 20 Nov 22:52 (Sully: "Make the icon red, not a giant red box. It's alarming") */
.taCard{background:linear-gradient(135deg,#2a3542 0,#1a222c 100%);border-color:#3a4756}.taCard .lic{background:#b7791f}
#mv{padding:0;z-index:21;overflow:hidden;display:none}
#mvTop{position:absolute;left:0;right:0;top:0;height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#b91c1c,#7f1d1d);color:#fff}
#mvTop .ib{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.25);color:#fff}
#mvBody{position:absolute;left:0;right:0;bottom:0;top:calc(54px + env(safe-area-inset-top));overflow:auto;padding:10px 12px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#mvBody .in{max-width:900px;margin:0 auto}
#mvCaves{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 8px}#mvCaves::-webkit-scrollbar{display:none}
.mvPill{flex:none;background:#2a1215;border:1px solid #7f1d1d;color:#fecaca;border-radius:16px;padding:6px 13px;font-weight:600;cursor:pointer}
.mvPill.on{background:#ef4444;border-color:#ef4444;color:#fff}
.mvPill.add{background:transparent;border-style:dashed;color:#fca5a5}
#mvPlot{position:relative;height:58vh;min-height:280px;background:#0b0f14;border:1px solid #3b1517;border-radius:14px;overflow:hidden}
#mvCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#mvTools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#mvTools button{width:40px;height:40px;border-radius:10px;background:rgba(14,20,27,.88);border:1px solid #7f1d1d;color:#fff;font-size:18px;cursor:pointer}
#mvKey{position:absolute;left:8px;top:8px;background:rgba(14,20,27,.88);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;pointer-events:none}
#mvKey i{display:inline-block;width:16px;height:4px;border-radius:2px;margin:0 5px 2px 0;vertical-align:middle}
#mv .btn,.mvth .btn{background:#dc2626}#mv .btn.alt,.mvth .btn.alt{background:#2a3542}
.mvRow{display:flex;align-items:center;gap:10px}.mvRow.on{outline:2px solid #ef4444}
.mvSw{width:14px;height:14px;border-radius:4px;flex:none;background:#ef4444}
.mvDelX{flex:none;padding:4px 8px;font-size:14px;background:transparent;border:1px solid #3b1517;border-radius:8px;color:#fca5a5}
.mvDel{color:#fca5a5}
.mvBadge{font-size:11.5px;font-weight:700;color:#fecaca;background:#3b1517;border-radius:10px;padding:2px 8px;white-space:nowrap}.mvBadge.off{color:#cbd5e1;background:#2a3542}
.mvNew{position:relative;border:2px solid #ef4444;border-radius:14px;overflow:hidden;background:var(--card);margin:4px 0 10px}
.mvNew img{display:block;width:100%;max-height:46vh;object-fit:contain;background:#fff;cursor:zoom-in}
.mvTag{position:absolute;left:10px;top:10px;background:#ef4444;color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.06em;border-radius:8px;padding:3px 8px}
.mvTh{width:54px;height:54px;object-fit:cover;border-radius:7px;background:#fff;flex:none}
.logChip{display:block;width:100%;text-align:left;background:#1e2a1e;border:1px solid #2f5f3a;color:#bbf7d0;border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px;font-weight:600;margin:0 0 8px;cursor:pointer}
#mvView{padding:0;background:#fff;z-index:28;overflow:hidden;display:none}
#mvvBar{position:absolute;left:0;right:0;top:0;height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:8px;background:#7f1d1d;color:#fff;z-index:2}
#mvvBar .ib{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.3);color:#fff}
#mvvWrap{position:absolute;inset:0;touch-action:none;overflow:hidden}
#mvvImg{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
</style>
</head>
<body>
<div id="top">
 <button class="ib" id="homeBtn" title="Home: caves, Tacheo, survey and everything else"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11 12 3l9 8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M10 21v-6h4v6"/></svg>Home</button>
 <h1 id="ttl">CartoTable</h1>
 <button class="ib" id="modeBtn" title="Switch between Topside and In the cave"></button>
 <div class="seg" id="views"><button data-v="plan" class="on">Plan</button><button data-v="profile">Profile</button><button data-v="3d">3-D</button></div>
 <button class="ib" id="measureBtn" title="Measure between two points">📏 Measure</button>
 <select id="colour" title="Colour the passages by"><option value="travel">Travel time</option><option value="grade">Precision</option><option value="depth">Depth</option><option value="trip">Trip</option><option value="plain">One colour</option></select>
 <input type="search" id="find" placeholder="Find a station" style="width:140px">
</div>
<div id="wrap"><canvas id="cv"></canvas><canvas id="gl"></canvas><div id="banner"></div><div id="north" title="North up">N</div><div id="locBtn" title="Show where I am"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5"/></svg></div><div id="legend"></div><div id="layBtn">Layers ▸</div><div id="attr"></div><div id="scale"></div></div>
<div id="side"><div id="grip"></div><div id="tabs"></div><div id="pane"></div></div>
<div id="home" class="over"><div class="in" id="homeIn"></div></div>

  TopsideAndroid.http(id,'POST',LOGURL,JSON.stringify({'Content-Type':'text/plain;charset=utf-8'}),btoa(unescape(encodeURIComponent(payload))),20000);});

 sheet('📋 App log','<div class="card"><b>'+(LOGON?'On':'Off')+'</b> · '+L.length+(L.length==1?' event':' events')+' on this phone'+(sent?' · last sent '+new Date(sent).toLocaleString():'')+'</div>'+
  '<div class="k">What it keeps</div><div class="mut" style="font-size:13.5px">The pages you open; Bluetooth connects, drops and how many shots arrive (the unit\'s kind and firmware); errors in the app; how long things take to load; online / offline; your phone model, Android version and the app version.</div>'+

  (LOGON?'<label class="lab"><input type="checkbox" id="logAuto"'+(auto?' checked':'')+'> Send it once a day when there\'s a signal</label><input class="fld" id="logName" placeholder="Your name (optional - so Sully knows whose it is)" value="'+esc(store('ct-logname')||'')+'" style="margin:6px 0">'+
   '<button class="btn" id="logSend">Send to Sully now</button><button class="btn alt" id="logOff">Turn off and clear</button>':'<button class="btn" id="logOn">Turn it on</button>')+
  '<div class="k">The newest lines</div>'+(rows||'<div class="mut">Nothing yet.</div>'));
